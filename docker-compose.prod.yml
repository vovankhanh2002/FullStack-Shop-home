services:
  postgres:
    image: postgres:16-alpine
    container_name: shophome_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: 
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
    expose:
      - "5432"
    volumes:
      - shophome_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${} -d ${}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shophome-prod-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shophome_prod_backend
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ""
      Jwt__Key: "${}"
      Jwt__Issuer: ""
      Jwt__Audience: ""
      Sepay__ApiKey: "${}"
      Sepay__BankName: "${}"
      Sepay__AccountNumber: "${}"
      Sepay__AccountName: "${}"
    ports:
      - "127.0.0.1:5002:8080"
    volumes:
      - shophome_prod_uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shophome-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${DOMAIN_URL:-http://localhost}
    container_name: shophome_prod_frontend
    restart: always
    environment:
      INTERNAL_API_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: ${DOMAIN_URL:-http://localhost}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - shophome-prod-net

volumes:
  shophome_prod_pg_data:
  shophome_prod_uploads:

networks:
  shophome-prod-net:
    driver: bridge
