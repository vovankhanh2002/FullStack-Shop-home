# ==========================================
# NGINX REVERSE PROXY CONFIGURATION FOR SHOPHOME
# Copy vào /etc/nginx/sites-available/shophome.conf
# ==========================================

# 1. Chuyển hướng HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name shophome.vn www.shophome.vn;

    # Certbot challenge (cho SSL Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server HTTPS chính
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shophome.vn www.shophome.vn;

    # SSL Certificates (Certbot sẽ tự sinh và điền đường dẫn này)
    ssl_certificate /etc/letsencrypt/live/shophome.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shophome.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cho phép upload ảnh sản phẩm dung lượng lớn (tối đa 50MB)
    client_max_body_size 50M;

    # A. Chuyển tiếp các request API sang Backend (.NET 8)
    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # B. Chuyển tiếp các request tải ảnh upload sang Backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:5002/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # C. Chuyển tiếp tất cả các trang giao diện sang Frontend (Next.js 14)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
